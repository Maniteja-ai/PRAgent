name: Ingestion checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - run: uv sync --locked --extra openai --extra gemini --extra vector --python 3.12
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q -m 'not integration'
