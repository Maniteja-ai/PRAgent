name: Coordinator checks
on:
  push:
    paths: ["packages/coordinator/**", "src/trace_impact/**", "pyproject.toml", ".github/workflows/coordinator.yml"]
  pull_request:
    paths: ["packages/coordinator/**", "src/trace_impact/**", "pyproject.toml", ".github/workflows/coordinator.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      # Static analysis imports every optional adapter, so install every
      # coordinator extra while keeping provider calls disabled in tests.
      - run: uv sync --locked --python 3.12 --all-extras
      - run: uv run --no-sync playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ../../src/trace_impact/ingestion/code/typescript --ignore-scripts
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync mypy src/trace_coordinator
      - name: Strict type check core contracts and dispatch
        run: >-
          uv run --no-sync mypy --strict
          src/trace_coordinator/domain
          src/trace_coordinator/config.py
          src/trace_coordinator/application/interfaces.py
          src/trace_coordinator/application/runtime.py
          src/trace_coordinator/infrastructure/ledger.py
      # Playwright calls execute in a worker thread. Python 3.12/Linux records
      # 87.4% while the same suite records 90.1% on Python 3.14/Windows.
      - run: uv run --no-sync pytest -q --cov=trace_coordinator --cov-branch --cov-fail-under=87 --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/tests.xml
      - run: uv build --wheel
      - name: Verify core without optional dependencies
        run: |
          uv venv /tmp/coordinator-core --python 3.12
          uv pip install --python /tmp/coordinator-core/bin/python dist/*.whl
          /tmp/coordinator-core/bin/python -c "import importlib.resources, importlib.util, trace_coordinator; assert importlib.util.find_spec('trace_impact') is None; assert importlib.resources.files('trace_coordinator').joinpath('py.typed').is_file()"
          /tmp/coordinator-core/bin/trace-coordinator run configs/demo.json examples/request.json --run-id isolated-core --output artifacts/isolated-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinator-test-reports
          path: packages/coordinator/artifacts/
