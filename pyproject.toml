[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-impact"
version = "0.4.0"
description = "Evidence-backed requirements ingestion for UI and code impact analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "beautifulsoup4>=4.13,<5", "httpx>=0.28,<1", "markdownify>=1.2,<2",
  "markdown-it-py>=4,<5", "neo4j>=6,<7", "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2", "filelock>=3.20,<4", "PyYAML>=6,<7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
vector = ["qdrant-client>=1.15,<2"]
gemini = [
    "langchain-google-genai>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
trace-impact = "trace_impact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_impact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an explicitly configured live Neo4j instance"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
