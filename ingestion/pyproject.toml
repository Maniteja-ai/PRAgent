[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testsigma-ingestion"
version = "0.1.0"
description = "Typed, dependency-injected ingestion pipeline"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastembed>=0.7,<1",
  "google-genai>=2.27,<3",
  "neo4j>=6,<7",
  "pydantic>=2.12,<2.13",
  "playwright>=1.50,<2",
  "python-dotenv>=1.1,<2",
  "qdrant-client>=1.15,<2",
  "tree-sitter-language-pack>=0.13,<2",
  "tree-sitter>=0.25.2,<0.26",
]

[project.scripts]
ingest = "ingestion.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["neo4j", "neo4j.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "google", "google.*", "qdrant_client", "qdrant_client.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true
