[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-coordinator"
version = "0.1.0"
description = "Bounded, resumable LangGraph orchestration for PR impact analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3", "filelock>=3.20,<4",
  "httpx>=0.28,<1", "python-dotenv>=1.1,<2",
  "langsmith>=0.14,<1",
  "urllib3>=2,<3",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=4,<5"]
openai = ["langchain-openai>=1,<2"]
browser = ["playwright>=1.55,<2"]
knowledge = ["trace-impact[gemini,vector]==0.4.0"]
dlp = ["google-cloud-dlp>=3,<4"]
webhook = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "PyJWT[crypto]>=2.10,<3"]

[tool.uv.sources]
trace-impact = { path = "../..", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "jsonschema>=4,<5",
  "ruff>=0.12,<1",
  "trio>=0.30,<1",
]

[project.scripts]
trace-coordinator = "trace_coordinator.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_coordinator"]

[tool.hatch.build.targets.sdist]
include = ["src/trace_coordinator", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: controlled local Playwright browser integration", "integration: opt-in external services"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/trace_coordinator"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# trace-impact is a separately built package in this monorepo. Its public
# contracts are validated at this adapter boundary until that package ships a
# PEP 561 marker of its own.
module = ["trace_impact", "trace_impact.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-cloud-dlp does not publish PEP 561 metadata. Runtime values are
# validated into ArtifactScan immediately inside the DLP adapter.
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true
